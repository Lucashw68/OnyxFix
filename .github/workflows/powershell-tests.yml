name: PowerShell tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install quality tools
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Refuse proprietary binaries
        shell: powershell
        run: |
          $blocked = @(Get-ChildItem -Recurse -File | Where-Object Extension -in '.sys','.cat','.dll','.exe')
          if ($blocked) { throw "Forbidden binaries: $($blocked.FullName -join ', ')" }
      - name: Run PSScriptAnalyzer
        shell: powershell
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error -EnableExit
      - name: Run Pester
        shell: powershell
        run: Invoke-Pester -Path tests -CI -Output Detailed
